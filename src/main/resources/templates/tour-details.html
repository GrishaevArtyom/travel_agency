<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${tour.name} + ' | Туристическое агентство'">Детали тура</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top py-3">
  <div class="container">
    <a class="navbar-brand fw-bold">Туристическое агентство</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <div class="navbar-nav gap-2 align-items-center">

        <a th:href="@{/}" class="btn btn-outline-primary btn-sm">Главная</a>
        <a th:href="@{/tours}" class="btn btn-outline-primary btn-sm">Туры</a>
        <a th:href="@{/about}" class="btn btn-outline-primary btn-sm">О нас</a>

        <!-- Profile -->
        <a th:href="@{/profile}" sec:authorize="hasRole('USER')" class="btn btn-success btn-sm ms-2">
          <i class="bi bi-person-circle"></i> Личный кабинет
        </a>

        <!-- Admin -->
        <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')" class="btn btn-warning btn-sm text-white ms-2">
          <i class="bi bi-shield-lock"></i> Админ
        </a>

        <!-- Auth Buttons -->
        <a th:href="@{/login}" sec:authorize="isAnonymous()" class="btn btn-outline-secondary btn-sm ms-2">Войти</a>
        <a th:href="@{/register}" sec:authorize="isAnonymous()" class="btn btn-secondary btn-sm ms-2">Регистрация</a>

        <!-- Logout -->
        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="ms-2">
          <button type="submit" class="btn btn-danger btn-sm">
            <i class="bi bi-box-arrow-right"></i> Выйти
          </button>
        </form>

      </div>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">

          <!-- Заголовок -->
          <h1 class="text-center mb-4" th:text="${tour.name}">Название тура</h1>

          <!-- Фото -->
          <div class="mb-4 text-center">
            <img th:src="${tour.imageUrl}" alt="Фото тура" class="img-fluid rounded shadow-sm" style="max-height: 400px; object-fit: cover;">
          </div>

          <!-- Информация о туре -->
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <div class="border p-3 rounded text-center">
                <h6 class="text-muted">Цена</h6>
                <p class="fw-bold text-success fs-5" th:text="${tour.price} + ' ₽'">Цена</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="border p-3 rounded text-center">
                <h6 class="text-muted">Тип тура</h6>
                <p class="fw-bold" th:text="${tour.type}">Тип</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="border p-3 rounded text-center">
                <h6 class="text-muted">Страна</h6>
                <p class="fw-bold" th:text="${tour.country}">Страна</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="border p-3 rounded text-center">
                <h6 class="text-muted">Даты</h6>
                <p class="fw-bold" th:text="${tour.startDate} + ' – ' + ${tour.endDate}">Даты</p>
              </div>
            </div>
          </div>

          <!-- Описание -->
          <div class="mb-4">
            <h3 class="text-primary text-center">Описание тура</h3>
            <p class="text-muted text-center" th:text="${tour.description}">Описание</p>
          </div>

          <!-- Действия -->
          <div class="d-flex justify-content-center gap-3 flex-wrap">
            <form th:action="@{/booking/{id}(id=${tour.id})}" method="post">
              <button type="submit" class="btn btn-success btn-lg" sec:authorize="hasRole('USER')">Забронировать тур</button>
            </form>
            <a th:href="@{/tours}" class="btn btn-secondary btn-lg">Вернуться к списку туров</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
