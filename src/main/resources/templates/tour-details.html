<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
  <meta charset="UTF-8">
  <title th:text="${tour.name} + ' | Туристическое агентство'">Детали тура</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Верхняя панель -->
<div class="bg-light shadow-sm py-3">
  <div class="container d-flex justify-content-center flex-wrap gap-3">
    <a th:href="@{/}" class="btn btn-primary">Главная страница</a>
    <a th:href="@{/tours}" class="btn btn-primary">Смотреть доступные туры</a>
    <a th:href="@{/about}" class="btn btn-primary">Об авторе</a>

    <!-- Показываем, если пользователь НЕ вошёл -->
    <a th:href="@{/login}" class="btn btn-secondary" sec:authorize="isAnonymous()">Войти</a>
    <a th:href="@{/register}" class="btn btn-secondary" sec:authorize="isAnonymous()">Зарегистрироваться</a>

    <!-- Показываем, если пользователь ВОШЁЛ -->
    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="d-inline">
      <button type="submit" class="btn btn-danger">Выйти</button>
    </form>
  </div>
</div>

<!-- Основной контент -->
<div class="container my-5">
  <div class="row">
    <div class="col-lg-8 mx-auto">
      <div class="card shadow-sm">
        <div class="card-body">
          <!-- Заголовок -->
          <h1 class="card-title text-center mb-4" th:text="${tour.name}">Название тура</h1>

          <!-- Галерея -->
          <div class="mb-4">
            <img th:src="${tour.imageUrl}" alt="Фото тура" class="img-fluid rounded shadow-sm">
          </div>

          <!-- Информация о туре -->
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <div class="border p-3 rounded">
                <h6 class="text-muted">Цена</h6>
                <p class="fw-bold text-success fs-5" th:text="${tour.price} + ' ₽'">Цена</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="border p-3 rounded">
                <h6 class="text-muted">Тип тура</h6>
                <p class="fw-bold" th:text="${tour.type}">Тип</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="border p-3 rounded">
                <h6 class="text-muted">Страна</h6>
                <p class="fw-bold" th:text="${tour.country}">Страна</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="border p-3 rounded">
                <h6 class="text-muted">Даты</h6>
                <p class="fw-bold" th:text="${tour.startDate} + ' – ' + ${tour.endDate}">Даты</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="border p-3 rounded">
                <h6 class="text-muted">Осталось мест</h6>
                <p class="fw-bold" th:text="${tour.stock}">Места</p>
              </div>
            </div>
          </div>

          <!-- Описание -->
          <div class="mb-4">
            <h3 class="text-primary">Описание тура</h3>
            <p th:text="${tour.description}" class="text-muted">Описание</p>
          </div>

          <!-- Действия -->
          <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-primary btn-lg">Забронировать тур</button>
            <a th:href="@{/tours}" class="btn btn-secondary btn-lg">Вернуться к списку туров</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
