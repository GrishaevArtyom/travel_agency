<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<div class="bg-light shadow-sm py-3">
    <div class="container d-flex justify-content-center flex-wrap gap-3">
        <a th:href="@{/}" class="btn btn-primary">Главная страница</a>
        <a th:href="@{/tours}" class="btn btn-primary">Смотреть доступные туры</a>
        <a th:href="@{/about}" class="btn btn-primary">Об авторе</a>

        <!-- Показываем, если пользователь НЕ вошёл -->
        <a th:href="@{/login}" class="btn btn-secondary" sec:authorize="isAnonymous()">Войти</a>
        <a th:href="@{/register}" class="btn btn-secondary" sec:authorize="isAnonymous()">Зарегистрироваться</a>

        <!-- Кнопка для пользователей с ролью admin -->
        <a th:href="@{/admin}" class="btn btn-warning" sec:authorize="hasRole('ADMIN')">Панель администратора</a>

        <!-- Кнопка для пользователей с ролью user -->
        <a th:href="@{/profile}" class="btn btn-warning active" sec:authorize="hasRole('USER')">Личный кабинет</a>

        <!-- Показываем, если пользователь ВОШЁЛ -->
        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="d-inline">
            <button type="submit" class="btn btn-danger">Выйти</button>
        </form>
    </div>
</div>

<div class="container my-5">
    <h1 class="text-center mb-4">Личный кабинет</h1>

    <div class="mb-5">
        <h2 class="text-center mb-3">Мои бронирования</h2>

        <div th:if="${bookings.isEmpty()}" class="text-center">
            <p class="text-muted">У вас пока нет забронированных туров.</p>
        </div>

        <div th:unless="${bookings.isEmpty()}" class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                <tr>
                    <th>Тур</th>
                    <th>Страна</th>
                    <th>Даты</th>
                    <th>Бронирование</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="booking : ${bookings}">
                    <td th:text="${booking.tour.name}"></td>
                    <td th:text="${booking.tour.country}"></td>
                    <td th:text="${#dates.format(booking.tour.startDate, 'dd.MM.yyyy')} + ' — ' + ${#dates.format(booking.tour.endDate, 'dd.MM.yyyy')}"></td>
                    <td th:text="${booking.quantity}"></td>
                    <td th:text="${#dates.format(booking.bookingDate, 'dd.MM.yyyy HH:mm')}"></td>
                    <td>
                        <form th:action="@{/profile/cancel/{id}(id=${booking.id})}" method="post"
                              onsubmit="return confirm('Вы уверены, что хотите отменить бронирование?');">
                            <button type="submit" class="btn btn-danger btn-sm">Отменить</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
