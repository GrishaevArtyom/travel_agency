<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top py-3">
    <div class="container">
        <a class="navbar-brand fw-bold">Туристическое агентство</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <div class="navbar-nav gap-2 align-items-center">
                <a th:href="@{/}" class="btn btn-outline-primary btn-sm">Главная</a>
                <a th:href="@{/tours}" class="btn btn-outline-primary btn-sm">Туры</a>
                <a th:href="@{/about}" class="btn btn-outline-primary btn-sm">Об авторе</a>

                <a th:href="@{/profile}" sec:authorize="hasRole('USER')" class="btn btn-success btn-sm ms-2 active">
                    <i class="bi bi-person-circle"></i> Личный кабинет
                </a>

                <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')" class="btn btn-warning btn-sm text-white ms-2">
                    <i class="bi bi-shield-lock"></i> Админ
                </a>

                <a th:href="@{/login}" sec:authorize="isAnonymous()" class="btn btn-outline-secondary btn-sm ms-2">Войти</a>
                <a th:href="@{/register}" sec:authorize="isAnonymous()" class="btn btn-secondary btn-sm ms-2">Регистрация</a>

                <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="ms-2">
                    <button type="submit" class="btn btn-danger btn-sm">
                        <i class="bi bi-box-arrow-right"></i> Выйти
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container my-5 flex-grow-1">
    <h1 class="text-center mb-5">Личный кабинет</h1>

    <div class="mb-5">
        <h2 class="text-center mb-4">Мои бронирования</h2>

        <div th:if="${bookings.isEmpty()}" class="text-center">
            <p class="text-muted fs-5">У вас пока нет забронированных туров.</p>
        </div>

        <div th:unless="${bookings.isEmpty()}" class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Тур</th>
                    <th>Страна</th>
                    <th>Даты</th>
                    <th>Цена</th>
                    <th>Дата бронирования</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="booking : ${bookings}">
                    <td th:text="${booking.tourName}"></td>
                    <td th:text="${booking.country}"></td>
                    <td th:text="${booking.startDate} + ' — ' + ${booking.endDate}"></td>
                    <td th:text="${booking.price} + ' ₽'"></td>
                    <td th:text="${#temporals.format(booking.bookingDate, 'dd MMM yyyy, HH:mm')}"></td>
                    <td>
                        <form th:action="@{/profile/cancel/{id}(id=${booking.id})}" method="post">
                            <button type="submit" class="btn btn-danger btn-sm">Отменить</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
