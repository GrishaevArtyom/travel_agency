<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Управление турами</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"/>
</head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top py-3">
    <div class="container">
        <a class="navbar-brand fw-bold">Туристическое агентство</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <div class="navbar-nav gap-2 align-items-center">
                <a th:href="@{/}" class="btn btn-outline-primary btn-sm">Главная</a>
                <a th:href="@{/tours}" class="btn btn-outline-primary btn-sm">Туры</a>
                <a th:href="@{/about}" class="btn btn-outline-primary btn-sm">Об авторе</a>
                <a th:href="@{/profile}" sec:authorize="hasRole('USER')" class="btn btn-success btn-sm ms-2">
                    <i class="bi bi-person-circle"></i> Кабинет
                </a>
                <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')" class="btn btn-warning btn-sm text-white ms-2 active">
                    <i class="bi bi-shield-lock"></i> Админ
                </a>
                <a th:href="@{/login}" sec:authorize="isAnonymous()" class="btn btn-outline-secondary btn-sm ms-2">Войти</a>
                <a th:href="@{/register}" sec:authorize="isAnonymous()" class="btn btn-secondary btn-sm ms-2">Регистрация</a>
                <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="ms-2">
                    <button type="submit" class="btn btn-danger btn-sm">
                        <i class="bi bi-box-arrow-right"></i> Выйти
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>
<div class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-12">
            <h1 class="text-center mb-4">Управление турами</h1>
            <a href="/admin" class="btn btn-secondary mb-3">← Назад</a>
            <div class="table-responsive mb-4">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Название</th>
                        <th>Страна</th>
                        <th>Тип</th>
                        <th>Цена</th>
                        <th>Начало</th>
                        <th>Конец</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="tour : ${tours}">
                        <td th:text="${tour.name}"></td>
                        <td th:text="${tour.country}"></td>
                        <td th:text="${tour.type}"></td>
                        <td th:text="${tour.price} + ' ₽'"></td>
                        <td th:text="${tour.startDate}"></td>
                        <td th:text="${tour.endDate}"></td>
                        <td>
                            <div class="d-flex gap-2">
                                <a th:href="@{/admin/tours/edit/{id}(id=${tour.id})}" class="btn btn-warning btn-sm">Редактировать</a>
                                <form th:action="@{/admin/tours/delete/{id}(id=${tour.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <h3 class="mb-4" th:text="${tour.id != null ? 'Редактирование тура' : 'Добавление нового тура'}"></h3>
            <form th:action="@{/admin/tours/save}" method="post" enctype="multipart/form-data" class="row g-3">
                <input type="hidden" name="id" th:value="${tour.id}"/>
                <div class="col-md-6">
                    <label class="form-label">Название</label>
                    <input type="text" name="name" th:value="${tour.name}" class="form-control" maxlength="50"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Страна</label>
                    <input type="text" name="country" th:value="${tour.country}" class="form-control" required maxlength="50"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Тип</label>
                    <select name="type" class="form-select" required>
                        <option value="пляжный" th:selected="${tour.type == 'пляжный'}">Пляжный</option>
                        <option value="экскурсионный" th:selected="${tour.type == 'экскурсионный'}">Экскурсионный</option>
                        <option value="приключенческий" th:selected="${tour.type == 'приключенческий'}">Приключенческий</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Цена</label>
                    <input type="number" name="price" th:value="${tour.price}" class="form-control" required min="0" max="10000000"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Дата начала</label>
                    <input type="date" name="startDate" th:value="${tour.startDate}" class="form-control" min="2020-01-01" max="2030-12-31" required/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Дата окончания</label>
                    <input type="date" name="endDate" th:value="${tour.endDate}" class="form-control" min="2020-01-01" max="2030-12-31" required/>
                </div>
                <div class="col-md-8">
                    <label class="form-label">Изображение</label>
                    <input type="file" name="imageFile" class="form-control" required/>
                </div>
                <div class="col-md-12">
                    <label class="form-label">Описание</label>
                    <textarea name="description" th:text="${tour.description}" class="form-control" rows="3" required maxlength="4000"></textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-success">
                        <span th:if="${tour.id == null}">Добавить тур</span>
                        <span th:if="${tour.id != null}">Сохранить изменения</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
