<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="/css/main.css" type="text/css">
</head>
<body>

<div class="header">
    <div class="nav-buttons">
        <a th:href="@{/}" class="btn">Вернуться на главную страницу</a>
    </div>
</div>

<div class="main-content">
    <div class="auth-container">
        <h1>Вход в систему</h1>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="form-group">
                <label for="login-username">Имя пользователя:</label>
                <input type="text" id="login-username" name="username" required class="form-input">
            </div>

            <div class="form-group">
                <label for="login-password">Пароль:</label>
                <input type="password" id="login-password" name="password" required class="form-input">
            </div>

            <button type="submit" class="btn btn-primary">Войти</button>

            <div class="auth-link">
                Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
