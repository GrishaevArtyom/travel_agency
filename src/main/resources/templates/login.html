<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Верхняя панель -->
<div class="bg-light shadow-sm py-3">
    <div class="container d-flex justify-content-center">
        <a th:href="@{/}" class="btn btn-primary">Вернуться на главную страницу</a>
    </div>
</div>

<!-- Основной контент -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="text-center mb-4">Вход в систему</h1>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="login-username" class="form-label">Имя пользователя:</label>
                            <input type="text" id="login-username" name="username" required class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="login-password" class="form-label">Пароль:</label>
                            <input type="password" id="login-password" name="password" required class="form-control">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Войти</button>

                        <div class="text-center mt-3">
                            <span>Нет аккаунта? <a th:href="@{/register}" class="text-decoration-none">Зарегистрироваться</a></span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
