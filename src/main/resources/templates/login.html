<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Вход в систему</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top py-3">
    <div class="container">
        <a class="navbar-brand fw-bold">Туристическое агентство</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <div class="navbar-nav gap-2 align-items-center">
                <a th:href="@{/}" class="btn btn-outline-primary btn-sm">Главная</a>
                <a th:href="@{/tours}" class="btn btn-outline-primary btn-sm">Туры</a>
                <a th:href="@{/about}" class="btn btn-outline-primary btn-sm">Об авторе</a>
                <a th:href="@{/register}" class="btn btn-secondary btn-sm ms-2">Регистрация</a>
            </div>
        </div>
    </div>
</nav>
<div class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="text-center mb-4">Вход в систему</h1>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="login-username" class="form-label">Имя пользователя:</label>
                            <input type="text" id="login-username" name="username" required class="form-control"/>
                        </div>
                        <div class="mb-3">
                            <label for="login-password" class="form-label">Пароль:</label>
                            <input type="password" id="login-password" name="password" required class="form-control"/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Войти</button>
                        <div class="text-center mt-3">
                            Нет аккаунта?
                            <a th:href="@{/register}" class="text-decoration-none">Зарегистрироваться</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<footer class="bg-light shadow-sm py-3 mt-auto">
    <div class="container">
        <div class="text-center">
            <p class="mb-0 text-muted">© 2025 Курсовая работа "Туристическое агентство"</p>
        </div>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
