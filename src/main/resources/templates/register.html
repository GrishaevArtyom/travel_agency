<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация</title>
  <link rel="stylesheet" href="/css/main.css" type="text/css">
</head>
<body>

<div class="header">
  <div class="nav-buttons">
    <a th:href="@{/}" class="btn">Вернуться на главную страницу</a>
  </div>
</div>

<div class="main-content">
  <div class="auth-container">
    <h1>Регистрация</h1>

    <form method="post" th:action="@{/register}" th:object="${user}" class="auth-form">
      <div class="form-group">
        <label for="username">Имя пользователя:</label>
        <input type="text" id="username" th:field="*{username}" required class="form-input"/>
      </div>

      <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" th:field="*{password}" required class="form-input"/>
      </div>

      <button type="submit" class="btn btn-primary">Зарегистрироваться</button>

      <div class="auth-link">
        Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
      </div>
    </form>
  </div>
</div>

</body>
</html>
