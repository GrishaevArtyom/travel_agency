<!DOCTYPE html>
  <html xmlns:th="http://www.thymeleaf.org" lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="d-flex flex-column min-vh-100">

  <!-- Верхняя панель -->
  <div class="bg-light shadow-sm py-3">
    <div class="container d-flex justify-content-center">
      <a th:href="@{/}" class="btn btn-primary">Вернуться на главную страницу</a>
    </div>
  </div>

  <!-- Основной контент -->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="text-center mb-4">Регистрация</h1>

            <form method="post" th:action="@{/register}" th:object="${user}">
              <div class="mb-3">
                <label for="username" class="form-label">Имя пользователя:</label>
                <input type="text" id="username" th:field="*{username}" required class="form-control">
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Пароль:</label>
                <input type="password" id="password" th:field="*{password}" required class="form-control">
              </div>

              <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>

              <div class="text-center mt-3">
                <span>Уже есть аккаунт? <a th:href="@{/login}" class="text-decoration-none">Войти</a></span>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
  </html>
