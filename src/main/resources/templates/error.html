<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ошибка</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8 text-center">
      <div class="card shadow-lg border-0 rounded-lg p-5">
        <h1 class="text-danger mb-4">Непредвиденная ошибка</h1>
        <div class="mb-4">
          <p class="lead">К сожалению, во время обработки вашего запроса произошла ошибка.</p>
          <p th:if="${errorMessage}" th:text="${errorMessage}" class="text-muted"></p>
          <p th:if="${status}" class="text-muted">Статус ошибки: <span th:text="${status}"></span></p>
        </div>
        <div>
          <a href="/" class="btn btn-primary btn-lg">Вернуться на главную</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
