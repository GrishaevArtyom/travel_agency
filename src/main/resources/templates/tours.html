<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Доступные туры</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<div class="bg-light shadow-sm py-3">
    <div class="container d-flex justify-content-center flex-wrap gap-3">
        <a th:href="@{/}" class="btn btn-primary">Главная страница</a>
        <a th:href="@{/tours}" class="btn btn-primary active">Смотреть доступные туры</a>
        <a th:href="@{/about}" class="btn btn-primary">Об авторе</a>

        <a th:href="@{/profile}" class="btn btn-success" sec:authorize="hasRole('USER')">Личный кабинет </a>

        <a th:href="@{/admin}" class="btn btn-warning" sec:authorize="hasRole('ADMIN')">Панель администратора</a>

        <a th:href="@{/login}" class="btn btn-secondary" sec:authorize="isAnonymous()">Войти</a>
        <a th:href="@{/register}" class="btn btn-secondary" sec:authorize="isAnonymous()">Зарегистрироваться</a>

        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="d-inline">
            <button type="submit" class="btn btn-danger">Выйти</button>
        </form>
    </div>
</div>

<div class="container my-5">
    <h1 class="text-center mb-4">Список доступных туров</h1>

    <form method="get" th:action="@{/tours}" class="bg-light p-4 rounded shadow-sm mb-4">
        <div class="row g-3">
            <div class="col-md-4">
                <label for="country" class="form-label">Страна:</label>
                <input type="text" id="country" name="country" placeholder="Например: Россия" class="form-control">
            </div>
            <div class="col-md-4">
                <label for="type" class="form-label">Тип тура:</label>
                <select id="type" name="type" class="form-select">
                    <option value="">Любой тип</option>
                    <option value="пляжный">Пляжный</option>
                    <option value="экскурсионный">Экскурсионный</option>
                    <option value="приключенческий">Приключенческий</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="sort" class="form-label">Сортировка:</label>
                <select id="sort" name="sort" class="form-select">
                    <option value="">Без сортировки</option>
                    <option value="price">По цене (дешевые сначала)</option>
                    <option value="price,desc">По цене (дорогие сначала)</option>
                    <option value="startDate">По дате (ранние сначала)</option>
                    <option value="startDate,desc">По дате (поздние сначала)</option>
                </select>
            </div>
        </div>
        <div class="row g-3 mt-3">
            <div class="col-md-6">
                <label for="startFrom" class="form-label">Дата начала:</label>
                <input type="date" id="startFrom" name="startFrom" class="form-control">
            </div>
            <div class="col-md-6">
                <label for="startTo" class="form-label">Дата конца:</label>
                <input type="date" id="startTo" name="startTo" class="form-control">
            </div>
        </div>
        <div class="row g-3 mt-3">
            <div class="col-md-6">
                <label for="priceFrom" class="form-label">Цена от:</label>
                <input type="number" id="priceFrom" name="priceFrom" min="0" placeholder="От" class="form-control">
            </div>
            <div class="col-md-6">
                <label for="priceTo" class="form-label">Цена до:</label>
                <input type="number" id="priceTo" name="priceTo" min="0" placeholder="До" class="form-control">
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Применить фильтры</button>
            <button type="reset" class="btn btn-secondary">Сбросить</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="table-light">
            <tr>
                <th>Название</th>
                <th>Страна</th>
                <th>Тип</th>
                <th>Цена</th>
                <th>Дата начала</th>
                <th>Дата конца</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tour : ${tours}">
                <td th:text="${tour.name}"></td>
                <td th:text="${tour.country}"></td>
                <td th:text="${tour.type}"></td>
                <td th:text="${tour.price} + ' ₽'"></td>
                <td th:text="${tour.startDate}"></td>
                <td th:text="${tour.endDate}"></td>
                <td>
                    <a th:href="@{'/tours/' + ${tour.id}}" class="btn btn-sm btn-primary">Подробнее</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
