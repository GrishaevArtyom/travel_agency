<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Доступные туры</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"/>
</head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top py-3">
    <div class="container">
        <a class="navbar-brand fw-bold">Туристическое агентство</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <div class="navbar-nav gap-2 align-items-center">
                <a th:href="@{/}" class="btn btn-outline-primary btn-sm">Главная</a>
                <a th:href="@{/tours}" class="btn btn-primary btn-sm active">Туры</a>
                <a th:href="@{/about}" class="btn btn-outline-primary btn-sm">Об авторе</a>
                <a th:href="@{/profile}" sec:authorize="hasRole('USER')" class="btn btn-success btn-sm ms-2">
                    <i class="bi bi-person-circle"></i> Личный кабинет
                </a>
                <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')" class="btn btn-warning btn-sm text-white ms-2">
                    <i class="bi bi-shield-lock"></i> Админ
                </a>
                <a th:href="@{/login}" sec:authorize="isAnonymous()" class="btn btn-outline-secondary btn-sm ms-2">Войти</a>
                <a th:href="@{/register}" sec:authorize="isAnonymous()" class="btn btn-secondary btn-sm ms-2">Регистрация</a>
                <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="ms-2">
                    <button type="submit" class="btn btn-danger btn-sm">
                        <i class="bi bi-box-arrow-right"></i> Выйти
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>
<div class="container my-5">
    <h1 class="text-center mb-5">Доступные туры</h1>
    <div class="alert alert-info d-flex justify-content-between align-items-center mb-4 px-4 py-3 shadow-sm"
         th:if="${tours != null and not #lists.isEmpty(tours)}">
        <div>
            <strong th:text="'Найдено туров: ' + ${tourCount}">Найдено туров: 0</strong>
        </div>
        <div>
            <span th:text="'Минимальная цена: ' + ${minPrice} + ' ₽'">Мин. цена: 0</span> |
            <span th:text="'Максимальная цена: ' + ${maxPrice} + ' ₽'">Макс. цена: 0</span>
        </div>
    </div>
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title mb-4"><i class="bi bi-funnel"></i> Фильтры поиска</h5>
            <form method="get" th:action="@{/tours}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="country" class="form-label">Страна:</label>
                        <input type="text" id="country" name="country" placeholder="Например: Россия" class="form-control" maxlength="50"/>
                    </div>
                    <div class="col-md-4">
                        <label for="type" class="form-label">Тип тура:</label>
                        <select id="type" name="type" class="form-select">
                            <option value="">Любой тип</option>
                            <option value="пляжный">Пляжный</option>
                            <option value="экскурсионный">Экскурсионный</option>
                            <option value="приключенческий">Приключенческий</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="sort" class="form-label">Сортировка:</label>
                        <select id="sort" name="sort" class="form-select">
                            <option value="">Без сортировки</option>
                            <option value="price">По цене (дешевые сначала)</option>
                            <option value="price,desc">По цене (дорогие сначала)</option>
                            <option value="startDate">По дате (ранние сначала)</option>
                            <option value="startDate,desc">По дате (поздние сначала)</option>
                        </select>
                    </div>
                </div>
                <div class="row g-3 mt-3">
                    <div class="col-md-6">
                        <label for="startFrom" class="form-label">Дата начала:</label>
                        <input type="date" id="startFrom" name="startFrom" class="form-control"/>
                    </div>
                    <div class="col-md-6">
                        <label for="startTo" class="form-label">Дата конца:</label>
                        <input type="date" id="startTo" name="startTo" class="form-control"/>
                    </div>
                </div>
                <div class="row g-3 mt-3">
                    <div class="col-md-6">
                        <label for="priceFrom" class="form-label">Цена от:</label>
                        <input type="number" id="priceFrom" name="priceFrom" placeholder="От" class="form-control" step="0.01"/>
                    </div>
                    <div class="col-md-6">
                        <label for="priceTo" class="form-label">Цена до:</label>
                        <input type="number" id="priceTo" name="priceTo" placeholder="До" class="form-control" step="0.01"/>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="submit" class="btn btn-primary rounded-pill px-4"><i class="bi bi-search"></i> Найти туры</button>
                    <button type="reset" class="btn btn-outline-secondary rounded-pill px-4">Сбросить</button>
                </div>
            </form>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Название</th>
                <th>Страна</th>
                <th>Тип</th>
                <th>Цена</th>
                <th>Даты</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tour : ${tours}">
                <td th:text="${tour.name}"></td>
                <td th:text="${tour.country}"></td>
                <td th:text="${tour.type}"></td>
                <td class="fw-bold" th:text="${tour.price} + ' ₽'"></td>
                <td>
                    <span th:text="${tour.startDate}"></span> –
                    <span th:text="${tour.endDate}"></span>
                </td>
                <td>
                    <a th:href="@{'/tours/' + ${tour.id}}" class="btn btn-sm btn-outline-primary rounded-pill">
                        <i class="bi bi-eye"></i> Подробнее
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<footer class="bg-light shadow-sm py-3 mt-auto">
    <div class="container">
        <div class="text-center">
            <p class="mb-0 text-muted">© 2025 Курсовая работа "Туристическое агентство"</p>
        </div>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const priceFromInput = document.getElementById('priceFrom');
        const priceToInput = document.getElementById('priceTo');
        const startFromInput = document.getElementById('startFrom');
        const startToInput = document.getElementById('startTo');
        const countryInput = document.getElementById('country');

        // Функция для вывода ошибок
        function showError(input, message) {
            let errorDiv = input.parentElement.querySelector('.error-message');
            if (!errorDiv) {
                errorDiv = document.createElement('div');
                errorDiv.className = 'text-danger error-message small';
                input.parentElement.appendChild(errorDiv);
            }
            errorDiv.textContent = message;
        }

        // Очистка ошибок
        function clearError(input) {
            const errorDiv = input.parentElement.querySelector('.error-message');
            if (errorDiv) errorDiv.textContent = '';
        }

        // Проверка цен
        function validatePrices() {
            const priceFrom = parseFloat(priceFromInput.value);
            const priceTo = parseFloat(priceToInput.value);

            clearError(priceFromInput);
            clearError(priceToInput);

            if (priceFromInput.value !== '') {
                if (isNaN(priceFrom) || priceFrom < 0 || priceFrom > 10_000_000) {
                    showError(priceFromInput, 'Цена "от" должна быть от 0 до 10000000.');
                    return false;
                }

                const decimalCheck = /^[0-9]+(\.[0-9]{1,2})?$/;
                if (!decimalCheck.test(priceFrom.toString())) {
                    showError(priceFromInput, 'Максимум два знака после запятой.');
                    return false;
                }
            }

            if (priceToInput.value !== '') {
                if (isNaN(priceTo) || priceTo < 0 || priceTo > 10_000_000) {
                    showError(priceToInput, 'Цена "до" должна быть от 0 до 10000000.');
                    return false;
                }

                const decimalCheck = /^[0-9]+(\.[0-9]{1,2})?$/;
                if (!decimalCheck.test(priceTo.toString())) {
                    showError(priceToInput, 'Максимум два знака после запятой.');
                    return false;
                }
            }

            if (priceFromInput.value !== '' && priceToInput.value !== '' && priceFrom > priceTo) {
                showError(priceToInput, 'Цена "до" должна быть больше или равна цене "от".');
                return false;
            }

            return true;
        }

        // Проверка дат
        function validateDates() {
            const startFrom = startFromInput.value;
            const startTo = startToInput.value;

            clearError(startFromInput);
            clearError(startToInput);

            if (startFrom) {
                const dateFrom = new Date(startFrom);
                if (dateFrom.getFullYear() < 2020 || dateFrom.getFullYear() > 2030) {
                    showError(startFromInput, 'Год должен быть между 2020 и 2030.');
                    return false;
                }
            }

            if (startTo) {
                const dateTo = new Date(startTo);
                if (dateTo.getFullYear() < 2020 || dateTo.getFullYear() > 2030) {
                    showError(startToInput, 'Год должен быть между 2020 и 2030.');
                    return false;
                }
            }

            if (startFrom && startTo) {
                const dateFrom = new Date(startFrom);
                const dateTo = new Date(startTo);
                if (dateFrom > dateTo) {
                    showError(startToInput, 'Дата конца должна быть позже даты начала.');
                    return false;
                }
            }

            return true;
        }

        // Проверка страны — только буквы и пробелы
        function validateCountry() {
            const country = countryInput.value.trim();
            clearError(countryInput);

            if (country === '') return true;

            const regex = /^[a-zA-Zа-яА-ЯёЁ\s\-]+$/u;
            if (!regex.test(country)) {
                showError(countryInput, 'Страна должна содержать только буквы, пробелы и дефис.');
                return false;
            }

            return true;
        }

        // Обработчики событий
        function addValidationListeners() {
            [priceFromInput, priceToInput, startFromInput, startToInput, countryInput].forEach(input => {
                if (input) {
                    input.addEventListener('input', () => {
                        validatePrices();
                        validateDates();
                        validateCountry();
                    });
                }
            });

            // Перед отправкой формы
            document.querySelector('form').addEventListener('submit', function (e) {
                const validPrice = validatePrices();
                const validDate = validateDates();
                const validCountry = validateCountry();

                if (!(validPrice && validDate && validCountry)) {
                    e.preventDefault();
                    alert('Исправьте ошибки в форме перед отправкой.');
                }
            });
        }

        addValidationListeners();
    });
</script>
</body>
</html>
