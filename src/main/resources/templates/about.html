<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Об авторе</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"/>
</head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top py-3">
    <div class="container">
        <a class="navbar-brand fw-bold">Туристическое агентство</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <div class="navbar-nav gap-2 align-items-center">
                <a th:href="@{/}" class="btn btn-outline-primary btn-sm">Главная</a>
                <a th:href="@{/tours}" class="btn btn-outline-primary btn-sm">Туры</a>
                <a th:href="@{/about}" class="btn btn-primary btn-sm active">Об авторе</a>
                <a th:href="@{/profile}" sec:authorize="hasRole('USER')" class="btn btn-success btn-sm ms-2">
                    <i class="bi bi-person-circle"></i> Личный кабинет
                </a>
                <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')" class="btn btn-warning btn-sm text-white ms-2">
                    <i class="bi bi-shield-lock"></i> Админ
                </a>
                <a th:href="@{/login}" sec:authorize="isAnonymous()" class="btn btn-outline-secondary btn-sm ms-2">Войти</a>
                <a th:href="@{/register}" sec:authorize="isAnonymous()" class="btn btn-secondary btn-sm ms-2">Регистрация</a>
                <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="ms-2">
                    <button type="submit" class="btn btn-danger btn-sm">
                        <i class="bi bi-box-arrow-right"></i> Выйти
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm mb-4">
                <div class="card-body text-center">
                    <h1 class="card-title mb-4">Об авторе</h1>
                    <div id="authorInfo" class="fs-5 text-muted">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Загрузка...</span>
                        </div>
                        <p>Загрузка информации...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<footer class="bg-light shadow-sm py-3 mt-auto">
    <div class="container">
        <div class="text-center">
            <p class="mb-0 text-muted">© 2025 Курсовая работа "Туристическое агентство"</p>
        </div>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/api/author-info')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Ошибка при загрузке данных');
                }
                return response.json();
            })
            .then(data => {
                const authorInfoDiv = document.getElementById('authorInfo');
                authorInfoDiv.innerHTML = `
                    <p>
                        Вуз: ${data.university}<br/>
                        Курс: ${data.course}<br/>
                        Направление: ${data.specialization}<br/>
                        Группа: ${data.group}<br/>
                        Студент: ${data.student}<br/>
                        Курсовая работа на тему: "${data.theme}".
                    </p>
                `;
            })
            .catch(error => {
                console.error('Произошла ошибка:', error);
                const authorInfoDiv = document.getElementById('authorInfo');
                authorInfoDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i>
                        Не удалось загрузить информацию об авторе.
                        Пожалуйста, попробуйте обновить страницу.
                    </div>
                `;
            });
    });
</script>
</body>
</html>
